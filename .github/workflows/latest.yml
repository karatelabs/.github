name: Org README latest line

# Keeps the "Latest" line of the org profile README current: the newest karate
# release and the newest karatelabs.io blog post. Commits only when it changed.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh the latest line
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/latest.mjs profile/README.md
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Org README: refresh the latest line"
          git push
